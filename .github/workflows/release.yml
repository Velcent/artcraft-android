name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag release tujuan upload (kosong = hanya build + artifact)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  prepare-keystore:
    name: Prepare signing keystore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cek apakah release keystore sudah ada
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view keystore --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download keystore dari release (jika ada)
        if: steps.check.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p keys && chmod 700 keys
          echo "Downloading keystore from release 'keystore'..."
          gh release download keystore --repo "$GITHUB_REPOSITORY" \
             --pattern 'artcraft-builder.jks' --dir keys/ --clobber
          gh release download keystore --repo "$GITHUB_REPOSITORY" \
             --pattern 'keystore-password.txt' --dir keys/ --clobber
          
          if [ ! -f keys/keystore-password.txt ]; then
            echo "ERROR: keystore-password.txt not found in release!"
            exit 1
          fi
          
          mv keys/keystore-password.txt keys/.keystore-password
          chmod 600 keys/*
          echo "Keystore downloaded successfully"
          ls -la keys/

      - name: Generate keystore baru (jika belum ada)
        if: steps.check.outputs.exists == 'false'
        run: |
          mkdir -p keys && chmod 700 keys
          PASS=$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')
          echo "Generating new keystore..."
          keytool -genkeypair -noprompt -v \
            -keystore keys/artcraft-builder.jks -storetype JKS \
            -storepass "$PASS" -keypass "$PASS" \
            -alias artcraftbuilder -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=ArtCraft Android Builder, OU=Local Builds, O=ArtCraft, C=US"
          
          printf '%s\n' "$PASS" > keys/keystore-password.txt
          printf '%s\n' "$PASS" > keys/.keystore-password
          chmod 600 keys/*
          echo "Keystore generated successfully"
          ls -la keys/

      - name: Publish release keystore (jika baru di-generate)
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Creating release 'keystore'..."
          gh release create keystore \
            --repo "$GITHUB_REPOSITORY" \
            --title "keystore" \
            --notes "Generated by CI. Contains the signing keystore and password." \
            --prerelease \
            keys/artcraft-builder.jks \
            keys/keystore-password.txt

      - name: Upload keys sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: signing-keys
          path: keys/
          include-hidden-files: true

  build-apk:
    name: ${{ matrix.app }} (${{ matrix.abi.name }})
    needs: prepare-keystore
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        app:
          - cadcraft
          - deckcraft
          - designcraft
          - effectcraft
          - figcraft
          - filmcraft
          - gridcraft
          - lightcraft
          - pdfcraft
          - photocraft
          - soundcraft
          - vectorcraft
          - wordcraft
        abi:
          - name: arm64
            rust: aarch64-linux-android
            suffix: ""
          - name: x64
            rust: x86_64-linux-android
            suffix: "-x64"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Rust + target Android
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add aarch64-linux-android x86_64-linux-android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Pastikan NDK terpasang
        run: |
          if [ -z "$(ls -A "$ANDROID_HOME/ndk" 2>/dev/null)" ]; then
            sdkmanager "ndk;27.2.12479018"
          fi
          echo "NDK installed at: $(ls -d "$ANDROID_HOME/ndk/"*/)"

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: ${{ runner.os }}-cargo-v1

      - name: Cache target dir
        uses: actions/cache@v4
        with:
          path: build/${{ matrix.app }}/target
          key: target-${{ matrix.app }}-${{ matrix.abi.name }}-${{ github.run_id }}
          restore-keys: |
            target-${{ matrix.app }}-${{ matrix.abi.name }}-

      - name: Install cargo-apk
        run: command -v cargo-apk >/dev/null || cargo install cargo-apk --locked

      - name: Download keystore
        uses: actions/download-artifact@v4
        with:
          name: signing-keys
          path: keys/

      - name: Verifikasi keystore
        run: |
          echo "Verifying keystore files..."
          ls -la keys/
          if [ ! -f keys/artcraft-builder.jks ]; then
            echo "ERROR: artcraft-builder.jks not found!"
            exit 1
          fi
          if [ ! -f keys/.keystore-password ]; then
            echo "ERROR: .keystore-password not found!"
            exit 1
          fi
          echo "Keystore files verified"

      - name: Patch build-common.sh untuk support --target
        run: |
          echo "Patching build-common.sh to support --target flag..."
          
          # Backup dulu
          cp lib/build-common.sh lib/build-common.sh.bak
          
          # Patch baris yang menjalankan cargo apk build
          # Cari pola: "${APK_CMD[@]}" --release 2>&1
          # Ganti jadi: "${APK_CMD[@]}" --release ${ARTCRAFT_RUST_TARGET:+--target "$ARTCRAFT_RUST_TARGET"} 2>&1
          sed -i 's/"\${APK_CMD\[@\]}" --release 2>&1/"${APK_CMD[@]}" --release ${ARTCRAFT_RUST_TARGET:+--target "$ARTCRAFT_RUST_TARGET"} 2>\&1/g' lib/build-common.sh
          
          # Verifikasi patch berhasil
          if grep -q 'ARTCRAFT_RUST_TARGET' lib/build-common.sh; then
            echo "Patch successful"
          else
            echo "ERROR: Patch failed!"
            exit 1
          fi

      - name: Build ${{ matrix.app }} (${{ matrix.abi.name }})
        env:
          ARTCRAFT_RUST_TARGET: ${{ matrix.abi.rust }}
        run: |
          echo "Building ${{ matrix.app }} for ${{ matrix.abi.name }}..."
          echo "Target: ${{ matrix.abi.rust }}"
          bash build.sh -${{ matrix.app }}

      - name: Siapkan file upload
        run: |
          mkdir -p upload
          for apk in output/*.apk; do
            if [ -f "$apk" ]; then
              base="$(basename "$apk" .apk)"
              cp -v "$apk" "upload/${base}${{ matrix.abi.suffix }}.apk"
            fi
          done
          ls -lh upload/
          sha256sum upload/*.apk || echo "No APK files generated!"

      - name: Upload ke release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: gh release upload "$TAG" upload/*.apk --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload sebagai artifact
        if: github.event_name != 'release' && !(github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.app }}-${{ matrix.abi.name }}
          path: upload/
