name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag release tujuan upload (kosong = hanya build + artifact)"
        required: false
        default: ""

permissions:
  contents: write   # membuat release keystore + upload asset

jobs:
  # ===========================================================
  # 1. Job tunggal: pastikan release "keystore" sudah terisi
  # ===========================================================
  prepare-keystore:
    name: Prepare signing keystore
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.check.outputs.exists == 'true' && 'downloaded' || 'generated' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (untuk keytool)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cek apakah release keystore sudah ada
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view keystore --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null 2>&1; then
            echo "exists=true"  >> "$GITHUB_OUTPUT"
            echo "Release keystore SUDAH ADA → akan dipakai."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Release keystore BELUM ADA → akan dibuat."
          fi

      - name: Download keystore dari release keystore (kalau sudah ada)
        if: steps.check.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p keys && chmod 700 keys
          gh release download keystore --repo "$GITHUB_REPOSITORY" \
             --pattern 'artcraft-builder.jks' --dir keys/ --clobber
          gh release download keystore --repo "$GITHUB_REPOSITORY" \
             --pattern 'keystore-password.txt' --dir keys/ --clobber
          mv keys/keystore-password.txt keys/.keystore-password
          chmod 600 keys/*

      - name: Generate keystore baru (kalau belum ada)
        if: steps.check.outputs.exists == 'false'
        run: |
          mkdir -p keys && chmod 700 keys
          PASS=$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')
          keytool -genkeypair -noprompt -v \
            -keystore keys/artcraft-builder.jks -storetype JKS \
            -storepass "$PASS" -keypass "$PASS" \
            -alias artcraftbuilder -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=ArtCraft Android Builder, OU=Local Builds, O=ArtCraft, C=US"
          printf '%s\n' "$PASS" > keys/keystore-password.txt
          printf '%s\n' "$PASS" > keys/.keystore-password
          chmod 600 keys/*

      - name: Publish release keystore (kalau baru di-generate)
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create keystore \
            --repo "$GITHUB_REPOSITORY" \
            --title "keystore" \
            --notes "Generated by CI. Contains the signing keystore and password. Do not delete unless you want to reset app signing." \
            --prerelease \
            keys/artcraft-builder.jks \
            keys/keystore-password.txt
          echo "Release 'keystore' sudah dibuat dan diisi."

      - name: Upload keys sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: signing-keys
          path: keys/
          include-hidden-files: true

  # ===========================================================
  # 2. Matrix build APK: 13 app × 2 ABI (arm64 + x64)
  # ===========================================================
  build-apk:
    name: ${{ matrix.app }} (${{ matrix.abi.name }})
    needs: prepare-keystore
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        app:
          - cadcraft
          - deckcraft
          - designcraft
          - effectcraft
          - figcraft
          - filmcraft
          - gridcraft
          - lightcraft
          - pdfcraft
          - photocraft
          - soundcraft
          - vectorcraft
          - wordcraft
        abi:
          - name: arm64
            rust: aarch64-linux-android
            suffix: ""          # persis seperti di gambar: <app>-<versi>.apk
          - name: x64
            rust: x86_64-linux-android
            suffix: "-x64"      # <app>-<versi>-x64.apk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Rust + target Android
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add aarch64-linux-android x86_64-linux-android

      - name: Set up Android SDK (platform 35 + build-tools)
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Pastikan NDK terpasang
        run: |
          if [ -z "$(ls -A "$ANDROID_HOME/ndk" 2>/dev/null)" ]; then
            sdkmanager "ndk;27.2.12479018"
          fi

      - name: Cache Cargo home
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: ${{ runner.os }}-cargo-v1

      - name: Cache target dir per app
        uses: actions/cache@v4
        with:
          path: build/${{ matrix.app }}/target
          key: target-${{ matrix.app }}-${{ matrix.abi.name }}-${{ github.run_id }}
          restore-keys: |
            target-${{ matrix.app }}-${{ matrix.abi.name }}-

      - name: Install cargo-apk (cargo-apk2 auto oleh builder)
        run: command -v cargo-apk >/dev/null || cargo install cargo-apk --locked

      - name: Download keystore dari release keystore
        uses: actions/download-artifact@v4
        with:
          name: signing-keys
          path: keys/

      - name: Aktifkan dukungan --target di build-common.sh
        run: |
          # Builder bawaan hanya aarch64. Sisipkan flag --target supaya ABI x64 bisa dibangun.
          sed -i 's/--release 2>&1/--release ${ARTCRAFT_RUST_TARGET:+--target "$ARTCRAFT_RUST_TARGET"} 2>\&1/' lib/build-common.sh

      - name: Build ${{ matrix.app }} (${{ matrix.abi.name }})
        env:
          ARTCRAFT_RUST_TARGET: ${{ matrix.abi.rust }}
        run: bash build.sh -${{ matrix.app }}

      - name: Siapkan nama file upload
        run: |
          mkdir -p upload
          for apk in output/*.apk; do
            base="$(basename "$apk" .apk)"
            cp -v "$apk" "upload/${base}${{ matrix.abi.suffix }}.apk"
          done
          ls -lh upload/
          sha256sum upload/*.apk

      - name: Upload APK ke release yang memicu workflow
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: gh release upload "$TAG" upload/*.apk --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload sebagai artifact (jika dijalankan manual tanpa release)
        if: github.event_name != 'release' && !(github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.app }}-${{ matrix.abi.name }}
          path: upload/
