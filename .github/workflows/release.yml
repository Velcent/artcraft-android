name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag release tujuan upload (kosong = hanya build + artifact)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  prepare-keystore:
    name: Prepare signing keystore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cek apakah release keystore sudah ada
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view keystore --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download keystore (kalau sudah ada)
        if: steps.check.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p keys && chmod 700 keys
          gh release download keystore --repo "$GITHUB_REPOSITORY" \
             --pattern 'artcraft-builder.jks' --dir keys/ --clobber
          gh release download keystore --repo "$GITHUB_REPOSITORY" \
             --pattern 'keystore-password.txt' --dir keys/ --clobber
          mv keys/keystore-password.txt keys/.keystore-password
          chmod 600 keys/*

      - name: Generate keystore baru (kalau belum ada)
        if: steps.check.outputs.exists == 'false'
        run: |
          mkdir -p keys && chmod 700 keys
          PASS=$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')
          keytool -genkeypair -noprompt -v \
            -keystore keys/artcraft-builder.jks -storetype JKS \
            -storepass "$PASS" -keypass "$PASS" \
            -alias artcraftbuilder -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=ArtCraft Android Builder, OU=Local Builds, O=ArtCraft, C=US"
          printf '%s\n' "$PASS" > keys/keystore-password.txt
          printf '%s\n' "$PASS" > keys/.keystore-password
          chmod 600 keys/*
          gh release create keystore \
            --repo "$GITHUB_REPOSITORY" \
            --title "keystore" \
            --notes "Generated by CI" \
            --prerelease \
            keys/artcraft-builder.jks \
            keys/keystore-password.txt

      - name: Upload keys artifact
        uses: actions/upload-artifact@v4
        with:
          name: signing-keys
          path: keys/
          include-hidden-files: true

  build-apk:
    name: ${{ matrix.app }} (${{ matrix.abi.name }})
    needs: prepare-keystore
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        app:
          - cadcraft
          - deckcraft
          - designcraft
          - effectcraft
          - figcraft
          - filmcraft
          - gridcraft
          - lightcraft
          - pdfcraft
          - photocraft
          - soundcraft
          - vectorcraft
          - wordcraft
        abi:
          - name: arm64
            rust: aarch64-linux-android
            suffix: ""
          - name: x64
            rust: x86_64-linux-android
            suffix: "-x64"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Rust + targets
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add aarch64-linux-android x86_64-linux-android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018"

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: cargo-${{ runner.os }}-v1

      - name: Install cargo-apk
        run: command -v cargo-apk >/dev/null || cargo install cargo-apk --locked

      - name: Download keystore
        uses: actions/download-artifact@v4
        with:
          name: signing-keys
          path: keys/

      - name: Patch build-common.sh untuk target ${{ matrix.abi.rust }}
        run: python3 .github/patch-for-target.py ${{ matrix.abi.rust }}

      - name: Build ${{ matrix.app }} (${{ matrix.abi.name }})
        run: bash build.sh -${{ matrix.app }}

      - name: Rename APK
        run: |
          mkdir -p upload
          for apk in output/*.apk; do
            base="$(basename "$apk" .apk)"
            cp "$apk" "upload/${base}${{ matrix.abi.suffix }}.apk"
          done
          ls -lh upload/

      - name: Upload ke release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: gh release upload "$TAG" upload/*.apk --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload sebagai artifact
        if: github.event_name != 'release' && !(github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.app }}-${{ matrix.abi.name }}
          path: upload/
